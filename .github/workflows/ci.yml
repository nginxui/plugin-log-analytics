name: CI

# Runs on every pull request and on main. The Go SDK is a module dependency,
# github.com/nginxui/plugin-sdk-go. The webapp comes
# from plugin-log-analytics-webapp: the API shape test reads its source at the
# release that webapp.lock names, and the packages carry that release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-log-analytics
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-log-analytics

      # The API shape test reads the webapp source of the release this plugin
      # packages.
      - name: Read webapp.lock
        id: webapp
        run: echo "version=$(sed -n 's/^version=//p' webapp.lock)" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          repository: nginxui/plugin-log-analytics-webapp
          ref: v${{ steps.webapp.outputs.version }}
          path: plugin-log-analytics-webapp

      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin-log-analytics/go.mod
          cache-dependency-path: plugin-log-analytics/go.sum

      # Downloads the webapp release webapp.lock names and checks it against the
      # checksum published with it.
      # The manifest test compares its fragment with the package paths.
      - name: Take the webapp release
        run: ./build.sh --webapp-only

      - name: gofmt
        run: |
          files=$(gofmt -l cmd internal main.go)
          if [ -n "${files}" ]; then
            echo "gofmt would change:"
            echo "${files}"
            exit 1
          fi

      - run: go vet . ./cmd/... ./internal/...

      - run: go test -race -count=1 . ./cmd/... ./internal/...

      # The plugin has to build without cgo: one static binary per platform.
      - name: Cross compile without cgo
        run: |
          for platform in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS="${platform%/*}" GOARCH="${platform#*/}" go build -o /dev/null .
          done

      # plugin.json is written by hand and the catalog reads it from the
      # release tag, so it must follow the contract.
      - name: plugin.json follows the plugin-spec schema
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/plugin.schema.json" \
            https://raw.githubusercontent.com/nginxui/plugin-spec/main/schema/plugin.schema.json
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 --strict=false \
            -c ajv-formats -s "${RUNNER_TEMP}/plugin.schema.json" -d plugin.json

      - name: Package the runner's platform
        run: ./build.sh --host-only
