name: CI

# Runs on every pull request and on main. The plugin still depends on the Go
# SDK through a `replace` to ../plugin-sdk-go, so it is checked out next to
# this one; drop that checkout once the SDK is published. The webapp comes
# from the plugin-log-analytics-webapp release that webapp.lock names.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-log-analytics
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-log-analytics

      - uses: actions/checkout@v4
        with:
          repository: nginxui/plugin-sdk-go
          path: plugin-sdk-go

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin-log-analytics/go.mod
          cache-dependency-path: plugin-log-analytics/go.sum

      # Downloads the webapp release webapp.lock names and checks its checksum.
      # The manifest test compares its fragment with the package paths.
      - name: Take the webapp release
        run: ./build.sh --webapp-only

      - name: gofmt
        run: |
          files=$(gofmt -l cmd internal main.go)
          if [ -n "${files}" ]; then
            echo "gofmt would change:"
            echo "${files}"
            exit 1
          fi

      - run: go vet . ./cmd/... ./internal/...

      - run: go test -race -count=1 . ./cmd/... ./internal/...

      # The plugin has to build without cgo: one static binary per platform.
      - name: Cross compile without cgo
        run: |
          for platform in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS="${platform%/*}" GOARCH="${platform#*/}" go build -o /dev/null .
          done

      # plugin.json is committed and the catalog reads it from the release
      # tag, so it must be what cmd/manifest generates from the code and the
      # webapp fragment.
      - name: plugin.json is up to date
        run: |
          go run ./cmd/manifest -out "${RUNNER_TEMP}/plugin.json" >/dev/null
          diff -u plugin.json "${RUNNER_TEMP}/plugin.json"

      - name: Package the runner's platform
        run: ./build.sh --host-only
