name: Release

# Builds, signs and publishes the per-platform packages when a version
# tag is pushed. The tag must match plugin.json, e.g. v1.0.0 for
# "version": "1.0.0".
#
# The "release" environment holds the signing key: PLUGIN_SIGNING_KEY is the
# minisign secret key file and PLUGIN_SIGNING_KEY_PASSWORD its password. Give
# the environment a required reviewer so a pushed tag alone cannot sign. The
# PLUGIN_SIGNING_PUBLIC_KEY variable, the matching public key, lets the run
# verify what it signed. The catalog (nginxui/plugins) polls this
# repository's releases and picks the new one up on its own.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # One executable per platform. SQLite is linked in through cgo, so every
  # platform builds with its C cross compiler from nginxui/setup-cgo, which are
  # the toolchains of the NGINX UI releases. macOS builds on a macOS runner.
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.goos == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: '386' }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: mips }
          - { goos: linux, goarch: mipsle }
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: mips64le }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: '386' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # linux/arm is built for ARMv5, which ARMv6 and ARMv7 run too.
      - id: cgo
        uses: nginxui/setup-cgo@v1
        with:
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goarm: ${{ matrix.goarch == 'arm' && '5' || '' }}

      - name: Build the executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '5' || '' }}
          EXTLDFLAGS: ${{ steps.cgo.outputs.extldflags }}
        run: |
          set -euo pipefail
          name="log-analytics-${GOOS}-${GOARCH}"
          if [[ "${GOOS}" == windows ]]; then
            name="${name}.exe"
          fi
          mkdir -p "${RUNNER_TEMP}/out"
          go build -trimpath -ldflags "-s -w -extldflags '${EXTLDFLAGS}'" -o "${RUNNER_TEMP}/out/${name}" .
          file "${RUNNER_TEMP}/out/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7

  # The tests and the checks of plugin.json, apart from the builds so both run
  # at the same time.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugin-log-analytics
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-log-analytics
          persist-credentials: false

      # The API shape test reads the webapp source of the release this plugin
      # packages.
      - name: Read webapp.lock
        id: webapp
        run: echo "version=$(sed -n 's/^version=//p' webapp.lock)" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          repository: nginxui/plugin-log-analytics-webapp
          ref: v${{ steps.webapp.outputs.version }}
          path: plugin-log-analytics-webapp
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin-log-analytics/go.mod
          cache-dependency-path: plugin-log-analytics/go.sum

      - name: Check that the tag matches plugin.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' plugin.json | head -n 1)
          if [ "${tag}" != "${version}" ]; then
            echo "tag v${tag} does not match plugin.json version ${version}"
            exit 1
          fi

      # Downloads the webapp release webapp.lock names and checks it against the
      # checksum published with it
      - name: Take the webapp release
        run: ./build.sh --webapp-only

      - run: go test -race -count=1 . ./cmd/... ./internal/...

      - name: plugin.json follows the plugin-spec schema
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/plugin.schema.json" \
            https://raw.githubusercontent.com/nginxui/plugin-spec/main/schema/plugin.schema.json
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 --strict=false \
            -c ajv-formats -s "${RUNNER_TEMP}/plugin.schema.json" -d plugin.json

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: plugin-log-analytics
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-log-analytics
          # git-cliff reads the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin-log-analytics/go.mod
          cache-dependency-path: plugin-log-analytics/go.sum

      # The packages carry the webapp release webapp.lock names, checked against
      # the checksum published with it
      - name: Take the webapp release
        run: ./build.sh --webapp-only

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: plugin-log-analytics/binaries

      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: Build and sign the packages
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_SIGNING_KEY_PASSWORD: ${{ secrets.PLUGIN_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_SIGNING_KEY}" ]; then
            echo "the PLUGIN_SIGNING_KEY secret is not set in the release environment; a release must be signed"
            exit 1
          fi
          key_file="${RUNNER_TEMP}/plugin-signing.key"
          trap 'rm -f "${key_file}"' EXIT
          (umask 077 && printf '%s\n' "${PLUGIN_SIGNING_KEY}" >"${key_file}")
          MINISIGN_KEY="${key_file}" MINISIGN_PASSWORD="${PLUGIN_SIGNING_KEY_PASSWORD}" ./build.sh --prebuilt binaries

      # Every archive: its .sha256 file, plugin.sums against the extracted
      # files, and the signature against the release public key when the
      # variable is set.
      - name: Verify the packages
        env:
          PLUGIN_SIGNING_PUBLIC_KEY: ${{ vars.PLUGIN_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          public_key=$(printf '%s\n' "${PLUGIN_SIGNING_PUBLIC_KEY}" | grep -Ev '^untrusted comment:' | tr -d '[:space:]')
          if [ -z "${public_key}" ]; then
            echo "::notice title=Signatures not checked::Set the PLUGIN_SIGNING_PUBLIC_KEY variable to the release public key to verify the signatures here."
          fi
          for archive in dist/*.tar.gz; do
            echo "::group::${archive}"
            (cd dist && sha256sum -c "$(basename "${archive}").sha256")
            dir=$(mktemp -d)
            tar -xzf "${archive}" -C "${dir}"
            test -f "${dir}/plugin.sums"
            test -f "${dir}/plugin.sums.minisig"
            (cd "${dir}" && sha256sum -c --quiet plugin.sums)
            if [ -n "${public_key}" ]; then
              minisign -V -q -m "${dir}/plugin.sums" -x "${dir}/plugin.sums.minisig" -P "${public_key}"
              echo "plugin.sums.minisig verifies against PLUGIN_SIGNING_PUBLIC_KEY"
            fi
            rm -rf "${dir}"
            echo "::endgroup::"
          done

      # The notes list the features and fixes since the previous tag, generated
      # from the commit messages by git-cliff (cliff.toml).
      - name: Release notes
        id: notes
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          npx --yes git-cliff@2.14.2 --current --strip all --output "${notes}"
          if grep -q '[^[:space:]]' "${notes}"; then
            echo "path=${notes}" >>"${GITHUB_OUTPUT}"
          else
            echo "No feature or fix since the previous tag, the notes will be generated by GitHub"
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          if [ -n "${NOTES}" ]; then
            notes=(--notes-file "${NOTES}")
          else
            notes=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            "${notes[@]}" \
            dist/*.tar.gz dist/*.tar.gz.sha256
